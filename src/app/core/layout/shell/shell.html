<!-- Fixed sidebar + sticky toolbar layout replacing mat-sidenav-container.
     The sidebar is always visible on desktop; a future responsive pass
     can add a hamburger toggle for mobile. -->
<div class="app-shell">

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside class="sidebar">
    <!-- Sidebar brand: entire block is a home link so both icon and title are clickable -->
    <a class="sb-brand" routerLink="/">
      <div class="brand-icon">
        <mat-icon>hub</mat-icon>
      </div>
      <span class="brand-name">GraphQL Tutorial</span>
    </a>

    <nav class="sb-nav">
      <span class="sec-label">Menu</span>
      @for (item of navItems; track item.route) {
        <a class="nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          <mat-icon>{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }
    </nav>
  </aside>

  <!-- ── Main area ─────────────────────────────────────────────── -->
  <div class="app-main">
    <header class="toolbar">
      <!-- Title links to / so the user can return home from any page -->
      <a class="tb-title" routerLink="/">GraphQL Tutorial</a>
      <div class="tb-actions">
        <!-- Theme toggle: sets data-theme on <html> so all CSS token
             blocks (prefers-color-scheme and [data-theme]) stay in sync.
             The initial icon reflects the actual current theme (OS or explicit). -->
        <button class="theme-btn"
                (click)="toggleTheme()"
                [title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

</div>
