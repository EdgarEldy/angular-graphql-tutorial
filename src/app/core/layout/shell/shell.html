<!-- Fixed sidebar + sticky toolbar layout.
     The sidebar is always visible; admin items appear for ADMIN users only. -->
<div class="app-shell">

  <!-- ── Sidebar ──────────────────────────────────────────────── -->
  <aside class="sidebar">
    <div class="sb-brand">
      <div class="brand-icon">
        <mat-icon>hub</mat-icon>
      </div>
      <span class="brand-name">GraphQL Tutorial</span>
    </div>

    <nav class="sb-nav">
      <span class="sec-label">Menu</span>
      @for (item of navItems; track item.route) {
        <a class="nav-item"
           [routerLink]="item.route"
           routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: false }">
          <mat-icon>{{ item.icon }}</mat-icon>
          {{ item.label }}
        </a>
      }

      <!-- Admin section: visible only when the current user holds the ADMIN role -->
      @if (isAdmin()) {
        <div class="sb-div"></div>
        <span class="sec-label">Administration</span>
        @for (item of adminNavItems; track item.route) {
          <a class="nav-item"
             [routerLink]="item.route"
             routerLinkActive="active"
             [routerLinkActiveOptions]="{ exact: false }">
            <mat-icon>{{ item.icon }}</mat-icon>
            {{ item.label }}
          </a>
        }
      }
    </nav>

    <div class="sb-footer">
      <!-- Logout button lives in the shell, not the service, because navigation is a UI concern -->
      <button class="nav-logout" (click)="logout()">
        <mat-icon>logout</mat-icon>
        Sign out
      </button>
    </div>
  </aside>

  <!-- ── Main area ─────────────────────────────────────────────── -->
  <div class="app-main">
    <header class="toolbar">
      <!-- Title links to / so the user can return home from any page -->
      <a class="tb-title" routerLink="/">GraphQL Tutorial</a>
      <div class="tb-actions">
        <!-- Theme toggle: sets data-theme on <html> so all CSS token
             blocks (prefers-color-scheme and [data-theme]) stay in sync.
             The initial icon reflects the actual current theme (OS or explicit). -->
        <button class="theme-btn"
                (click)="toggleTheme()"
                [title]="darkMode() ? 'Switch to light mode' : 'Switch to dark mode'">
          <mat-icon>{{ darkMode() ? 'light_mode' : 'dark_mode' }}</mat-icon>
        </button>
      </div>
    </header>

    <main class="content">
      <router-outlet />
    </main>
  </div>

</div>
