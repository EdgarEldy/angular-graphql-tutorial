<div class="dash">

  <!-- Page header -->
  <div class="dash-header">
    <div>
      <h1 class="dash-title">Welcome</h1>
      <p class="dash-sub">{{ today }}</p>
    </div>
  </div>

  <!-- KPI cards: sticky so they remain visible while scrolling the rest of the page -->
  <div class="kpi-bar">
    <div class="kpi-grid">
      @for (kpi of kpis; track kpi.label) {
        <div class="kpi-card">
          <div class="kpi-top">
            <span class="kpi-label">{{ kpi.label }}</span>
            <div class="kpi-icon kpi-{{ kpi.mod }}">
              <mat-icon fontSet="material-icons-outlined">{{ kpi.icon }}</mat-icon>
            </div>
          </div>
          <div class="kpi-value">{{ kpi.value }}</div>
        </div>
      }
    </div>
  </div>

  <!-- Quick access -->
  <p class="section-label">Quick access</p>
  <div class="tile-grid">
    @for (tile of tiles; track tile.route) {
      <a class="tile" [routerLink]="tile.route">
        <div class="tile-thumb tile-{{ tile.mod }}">
          <mat-icon fontSet="material-icons-outlined">{{ tile.icon }}</mat-icon>
        </div>
        <div class="tile-body">
          <span class="tile-name">{{ tile.label }}</span>
          <span class="tile-desc">{{ tile.desc }}</span>
        </div>
        <mat-icon class="tile-arrow" fontSet="material-icons-outlined">chevron_right</mat-icon>
      </a>
    }
  </div>

</div>
