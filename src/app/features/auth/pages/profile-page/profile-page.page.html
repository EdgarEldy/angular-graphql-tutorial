@if (user(); as u) {
  <mat-card class="profile-card">
    <mat-card-header>
      <mat-icon mat-card-avatar>account_circle</mat-icon>
      <mat-card-title>{{ u.firstName }} {{ u.lastName }}</mat-card-title>
      <mat-card-subtitle>{{ u.email }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <section class="status-row">
        @if (u.enabled) {
          <mat-chip color="primary" highlighted>Active</mat-chip>
        } @else {
          <mat-chip>Pending activation</mat-chip>
        }
        @if (u.accountLocked) {
          <mat-chip color="warn" highlighted>Locked</mat-chip>
        }
      </section>

      <mat-divider class="divider" />

      <section>
        <h3 class="section-title">Roles</h3>
        <div class="chip-list">
          @for (role of u.roles; track role.id) {
            <mat-chip>{{ role.roleName }}</mat-chip>
          } @empty {
            <span class="empty-hint">No roles assigned</span>
          }
        </div>
      </section>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" (click)="openEditDialog()">
        <mat-icon>edit</mat-icon>
        Edit profile
      </button>
    </mat-card-actions>
  </mat-card>
}
