<div class="page-container">
  <app-page-header
    title="Permissions"
    actionLabel="Create permission"
    (actionClicked)="openCreateDialog()" />

  @if (loading()) {
    <app-loading />
  } @else if (error()) {
    @let currentError = error();
    @if (currentError) {
      <app-error-banner [error]="currentError" (retryClicked)="retryLoad()" />
    }
  } @else if (permissions().length === 0) {
    <app-empty-state icon="security" message="No permissions found." />
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="permissions()" class="permissions-table">

        <ng-container matColumnDef="resource">
          <th mat-header-cell *matHeaderCellDef>Resource</th>
          <td mat-cell *matCellDef="let perm">{{ perm.resource }}</td>
        </ng-container>

        <ng-container matColumnDef="action">
          <th mat-header-cell *matHeaderCellDef>Action</th>
          <td mat-cell *matCellDef="let perm">{{ perm.action }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let perm">
            <button mat-icon-button color="warn" matTooltip="Delete permission" (click)="deletePermission(perm)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>
