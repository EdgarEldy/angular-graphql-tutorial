<div class="page-container">
  <app-page-header
    title="Roles"
    actionLabel="Create role"
    (actionClicked)="openCreateDialog()" />

  @if (loading()) {
    <app-loading />
  } @else if (error()) {
    <app-error-banner [error]="error()!" (retryClicked)="retryLoad()" />
  } @else if (roles().length === 0) {
    <app-empty-state icon="admin_panel_settings" message="No roles found." />
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="roles()" class="roles-table">

        <!-- Role name column -->
        <ng-container matColumnDef="roleName">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let role">{{ role.roleName }}</td>
        </ng-container>

        <!-- Permissions column -->
        <ng-container matColumnDef="permissions">
          <th mat-header-cell *matHeaderCellDef>Permissions</th>
          <td mat-cell *matCellDef="let role">
            <mat-chip-set>
              @for (perm of role.permissions; track perm.id) {
                <mat-chip>{{ perm.resource }}:{{ perm.action }}</mat-chip>
              }
              @if (role.permissions.length === 0) {
                <span class="no-perms">No permissions</span>
              }
            </mat-chip-set>
          </td>
        </ng-container>

        <!-- Actions column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let role">
            <button mat-icon-button matTooltip="Edit role" (click)="openEditDialog(role)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button matTooltip="Manage permissions" (click)="openManagePermissionsDialog(role)">
              <mat-icon>security</mat-icon>
            </button>
            <button mat-icon-button color="warn" matTooltip="Delete role" (click)="deleteRole(role)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  }
</div>
