<h2 mat-dialog-title>{{ title() }}</h2>

<mat-dialog-content>
  <form [formGroup]="form" novalidate>
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Category name</mat-label>
      <input matInput formControlName="categoryName" />
      @if (categoryNameControl.hasError('required')) {
        <mat-error>Category name is required</mat-error>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }
  </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancel</button>
  <button mat-flat-button color="primary" (click)="submit()" [disabled]="form.invalid || loading()">
    @if (loading()) {
      <mat-spinner diameter="20" />
    } @else {
      {{ isEdit() ? 'Save' : 'Create' }}
    }
  </button>
</mat-dialog-actions>
