<div class="page-container">
  <app-page-header
    title="Categories"
    [actionLabel]="headerActionLabel()"
    (actionClicked)="openCreateDialog()" />

  @if (loading()) {
    <app-loading />
  } @else if (error()) {
    @let currentError = error();
    @if (currentError) {
      <app-error-banner [error]="currentError" (retryClicked)="retryLoad()" />
    }
  } @else if (categories().length === 0) {
    <app-empty-state icon="category" message="No categories found." />
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="categories()" class="categories-table">

        <!-- Name column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let category">{{ category.categoryName }}</td>
        </ng-container>

        <!-- Actions column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let category">
            @if (isAdmin()) {
              <button mat-icon-button
                      matTooltip="Edit category"
                      (click)="openEditDialog(category)">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button
                      color="warn"
                      matTooltip="Delete category"
                      (click)="deleteCategory(category)">
                <mat-icon>delete</mat-icon>
              </button>
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalElements()"
      [pageIndex]="pageIndex()"
      [pageSize]="pageSize()"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      showFirstLastButtons />
  }
</div>
